[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/students/enroll"
  to = "/.netlify/functions/enroll"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://edsec-innovations.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
