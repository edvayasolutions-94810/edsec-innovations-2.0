<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081014" />
      <stop offset="50%" stop-color="#141D24" />
      <stop offset="100%" stop-color="#081014" />
    </linearGradient>
    <linearGradient id="gitOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="gGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#gBg)" />

  <g stroke="#14B8A6" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Git Branching Visualization -->
  <g transform="translate(400, 205)">
    <!-- Main line -->
    <line x1="-180" y1="20" x2="180" y2="20" stroke="#14B8A6" stroke-width="5" stroke-linecap="round" />
    <!-- Feature branch -->
    <path d="M-80,20 C-40,20 -40,-50 20,-50 L120,-50 C150,-50 160,20 180,20" fill="none" stroke="#F97316" stroke-width="5" stroke-linecap="round" />

    <!-- Commits on main -->
    <circle cx="-160" cy="20" r="14" fill="#0D9488" stroke="#2DD4BF" stroke-width="3" filter="url(#gGlow)" />
    <circle cx="-80" cy="20" r="14" fill="#0D9488" stroke="#2DD4BF" stroke-width="3" />
    <circle cx="20" cy="20" r="14" fill="#0D9488" stroke="#2DD4BF" stroke-width="3" />
    <circle cx="100" cy="20" r="14" fill="#0D9488" stroke="#2DD4BF" stroke-width="3" />
    <circle cx="180" cy="20" r="14" fill="#0D9488" stroke="#2DD4BF" stroke-width="3" filter="url(#gGlow)" />

    <!-- Commits on feature -->
    <circle cx="20" cy="-50" r="14" fill="#EA580C" stroke="#F97316" stroke-width="3" filter="url(#gGlow)" />
    <circle cx="90" cy="-50" r="14" fill="#EA580C" stroke="#F97316" stroke-width="3" filter="url(#gGlow)" />
  </g>

  <rect x="250" y="380" width="300" height="42" rx="21" fill="#0F2428" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="1.5" />
  <text x="400" y="407" fill="#E6FFFA" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">GIT &amp; CAREER MASTERY</text>
</svg>
