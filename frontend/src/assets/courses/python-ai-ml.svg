<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081014" />
      <stop offset="50%" stop-color="#0F1C23" />
      <stop offset="100%" stop-color="#091418" />
    </linearGradient>
    <linearGradient id="pythonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pythonYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#pBg)" />

  <g stroke="#14B8A6" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Python Dual Snake Motif stylized -->
  <g transform="translate(400, 205) scale(1.15)">
    <!-- Blue Upper Loop -->
    <path d="M-10,-80 C-45,-80 -60,-65 -60,-40 L-60,-20 L-20,-20 L-20,-10 L-60,-10 C-80,-10 -90,5 -90,25 C-90,45 -80,60 -55,60 L-45,60 L-45,40 L-55,40 C-68,40 -70,35 -70,25 C-70,15 -68,10 -55,10 L-20,10 C-5,10 5,0 5,-15 L5,-55 C5,-70 -5,-80 -10,-80 Z" fill="url(#pythonBlue)" filter="url(#pGlow)" />
    <circle cx="-35" cy="-55" r="7" fill="#FFFFFF" />

    <!-- Teal Lower Loop -->
    <path d="M10,80 C45,80 60,65 60,40 L60,20 L20,20 L20,10 L60,10 C80,10 90,-5 90,-25 C90,-45 80,-60 55,-60 L45,-60 L45,-40 L55,-40 C68,-40 70,-35 70,-25 C70,-15 68,-10 55,-10 L20,-10 C5,-10 -5,0 -5,15 L-5,55 C-5,70 5,80 10,80 Z" fill="url(#pythonYellow)" filter="url(#pGlow)" />
    <circle cx="35" cy="55" r="7" fill="#FFFFFF" />
  </g>

  <rect x="250" y="380" width="300" height="42" rx="21" fill="#0F2428" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="1.5" />
  <text x="400" y="407" fill="#E6FFFA" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">PYTHON WITH AI &amp; ML</text>
</svg>
